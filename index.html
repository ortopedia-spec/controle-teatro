<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#1a73e8" />
  <title>Controle de Entrada | Festival de Música 2026</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    :root{
      --primary:#1a73e8;
      --primary-dark:#0f5bd6;
      --success:#188038;
      --warning:#b06000;
      --danger:#d93025;
      --bg:#f4f6f8;
      --card:#fff;
      --text:#202124;
      --muted:#6b7280;
      --border:#dfe3e8;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      padding:14px;
      background:var(--bg);
      color:var(--text);
      font-family:Arial,sans-serif;
    }
    .wrap{max-width:560px;margin:0 auto;padding-bottom:24px}
    h1{font-size:23px;text-align:center;margin:4px 0 2px}
    .subtitle{text-align:center;color:var(--muted);font-size:13px;margin-bottom:14px}

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:16px;
      padding:14px;
      margin-top:12px;
      box-shadow:0 2px 8px rgba(0,0,0,.05);
    }

    #reader{
      width:100%;
      min-height:300px;
      background:#111;
      border-radius:16px;
      overflow:hidden;
    }
    #reader video{width:100%!important;height:auto!important}

    button,input{
      width:100%;
      min-height:48px;
      border-radius:12px;
      font-size:16px;
    }
    button{
      border:0;
      background:var(--primary);
      color:#fff;
      font-weight:700;
      cursor:pointer;
      padding:12px 14px;
      margin-top:10px;
    }
    button.secondary{background:var(--primary-dark)}
    button.danger{background:var(--danger)}
    button.light{background:#e8f0fe;color:#174ea6}
    button:disabled{opacity:.5;cursor:not-allowed}

    input{
      padding:12px;
      border:2px solid var(--border);
      background:#fff;
    }

    .search-row{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:12px}
    .search-row button{width:auto;margin:0;padding:0 16px}

    .badge{
      display:inline-block;
      padding:6px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:800;
    }
    .badge.wait{background:#fff1cc;color:#7a4e00}
    .badge.partial{background:#e8f0fe;color:#174ea6}
    .badge.done{background:#e6f4ea;color:#137333}
    .badge.authority{background:#fce8e6;color:#a50e0e;margin-left:6px}

    .name{font-size:22px;font-weight:800;margin:10px 0 2px}
    .meta{color:var(--muted);font-size:13px;line-height:1.45}

    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
    .stat{background:#f7f8fa;border-radius:14px;padding:12px;text-align:center}
    .stat .label{font-size:12px;color:var(--muted);margin-bottom:6px}
    .stat .value{font-size:30px;font-weight:800}
    .stat .small{font-size:12px;color:var(--muted);margin-top:4px}

    .section-title{font-size:13px;color:var(--muted);font-weight:800;margin:15px 0 7px;text-transform:uppercase}
    .info-row{margin-top:9px}
    .info-row .label{font-size:12px;color:var(--muted)}
    .info-row .value{font-size:15px;font-weight:600;margin-top:2px}

    .alert{
      border-radius:12px;
      padding:12px;
      margin-top:12px;
      line-height:1.4;
    }
    .alert.support{background:#fff4e5;border-left:4px solid #f9ab00}
    .alert.success{background:#e6f4ea;border-left:4px solid var(--success)}
    .alert.error{background:#fce8e6;border-left:4px solid var(--danger)}

    .qty-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
    .qty-box{border:1px solid var(--border);border-radius:14px;padding:12px}
    .qty-box label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
    .qty-control{display:grid;grid-template-columns:1fr 44px;gap:6px;align-items:stretch}
    .qty-box input{
      text-align:center;
      font-size:28px;
      font-weight:800;
      min-height:74px;
      padding:8px;
      -moz-appearance:textfield;
    }
    .qty-box input::-webkit-outer-spin-button,
    .qty-box input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
    .qty-stepper{display:grid;grid-template-rows:1fr 1fr;gap:6px}
    .qty-stepper button{
      margin:0;
      min-height:0;
      height:34px;
      padding:0;
      border:1px solid #c6dafc;
      background:#e8f0fe;
      color:#174ea6;
      font-size:18px;
      line-height:1;
      border-radius:10px;
    }
    .qty-help{font-size:11px;color:var(--muted);margin-top:5px;text-align:center}

    .hidden{display:none!important}

    .overlay{
      position:fixed;
      inset:0;
      z-index:1000;
      background:rgba(0,0,0,.48);
      padding:16px;
      display:none;
    }
    .modal{
      max-width:560px;
      margin:34px auto 0;
      background:#fff;
      border-radius:16px;
      max-height:82vh;
      overflow:hidden;
      display:flex;
      flex-direction:column;
    }
    .modal-head{background:var(--primary);color:#fff;padding:13px 14px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
    .modal-head button{width:auto;min-height:36px;margin:0;background:rgba(255,255,255,.18);padding:6px 10px}
    .modal-body{padding:12px;overflow:auto}
    .result{padding:12px;border-bottom:1px solid #eee;cursor:pointer}
    .result:last-child{border-bottom:0}
    .result-name{font-weight:800}
    .result-meta{font-size:12px;color:var(--muted);margin-top:4px}

    .toast{
      position:fixed;
      left:14px;
      right:14px;
      bottom:14px;
      z-index:2000;
      padding:14px;
      border-radius:12px;
      color:#fff;
      text-align:center;
      font-weight:700;
      box-shadow:0 4px 18px rgba(0,0,0,.2);
    }

    @media (max-width:420px){
      body{padding:10px}
      .grid,.qty-grid{gap:7px}
      .stat .value{font-size:27px}
      .qty-box{padding:10px}
      .qty-control{grid-template-columns:1fr 40px;gap:5px}
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>🎭 Controle de Entrada</h1>
    <div class="subtitle">Festival de Música 2026</div>

    <div id="scannerCard" class="card">
      <div id="reader"></div>
      <button id="btnStart" onclick="startScanner()">📷 Iniciar câmera</button>
      <button id="btnStop" class="danger hidden" onclick="stopScanner()">⏹️ Parar câmera</button>

      <div class="search-row">
        <input id="searchInput" placeholder="Buscar por nome ou telefone" autocomplete="off" />
        <button class="secondary" onclick="buscarManual()">Buscar</button>
      </div>
    </div>

    <div id="out" class="card hidden"></div>
  </div>

  <div id="overlay" class="overlay">
    <div class="modal">
      <div class="modal-head">
        <span>Selecionar convite</span>
        <button onclick="fecharResultados()">Fechar</button>
      </div>
      <div id="results" class="modal-body"></div>
    </div>
  </div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbyKVUbI8fsHE1ceIttS6XuBF9RQz8tJPUw0Y0Njgn-EDwk1D5OA1GkWDmunDqvr_LBoag/exec";
  const OPERADOR = "Portaria 01";

  let scanner = null;
  let cameraStarted = false;
  let scanEnabled = false;
  let currentInvite = null;

  const out = document.getElementById("out");
  const btnStart = document.getElementById("btnStart");
  const btnStop = document.getElementById("btnStop");

  function toast(msg, type="ok"){
    const el = document.createElement("div");
    el.className = "toast";
    el.style.background = type === "ok" ? "var(--success)" : type === "warn" ? "var(--warning)" : "var(--danger)";
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => {
      el.style.opacity = "0";
      el.style.transition = "opacity .35s";
    }, 2200);
    setTimeout(() => el.remove(), 2600);
  }

  async function api(action, payload = {}){
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({action, ...payload})
    });

    const data = await response.json();
    if (!data.ok) {
      throw new Error(data.error?.message || "Erro na comunicação com o servidor.");
    }
    return data.data;
  }

  async function startScanner(){
    if (!scanner) scanner = new Html5Qrcode("reader");

    try{
      await scanner.start(
        {facingMode:"environment"},
        {fps:10, qrbox:{width:240,height:240}},
        onScan,
        () => {}
      );

      cameraStarted = true;
      scanEnabled = true;
      btnStart.classList.add("hidden");
      btnStop.classList.remove("hidden");
      toast("Câmera pronta para leitura.", "ok");
    }catch(error){
      toast("Não foi possível iniciar a câmera: " + (error?.message || error), "bad");
    }
  }

  async function stopScanner(){
    if (!scanner || !cameraStarted) return;
    try{ await scanner.stop(); }catch(e){}
    try{ scanner.clear(); }catch(e){}
    cameraStarted = false;
    scanEnabled = false;
    btnStart.classList.remove("hidden");
    btnStop.classList.add("hidden");
  }

  function onScan(decodedText){
    if (!scanEnabled) return;
    scanEnabled = false;
    carregarConvite(String(decodedText || "").trim());
  }

  async function carregarConvite(idQr){
    currentInvite = null;
    mostrarLoading("Buscando convite...");

    try{
      const convite = await api("buscarConvite", {id_qr:String(idQr)});
      currentInvite = convite;
      renderConvite(convite);
    }catch(error){
      mostrarErro(error.message || String(error));
      if (cameraStarted) scanEnabled = true;
    }
  }

  async function buscarManual(){
    const termo = document.getElementById("searchInput").value.trim();

    try{
      const lista = await api("buscarConvites", {
        termo,
        somenteAbertos:true
      });
      abrirResultados(lista);
    }catch(error){
      toast(error.message || String(error), "bad");
    }
  }

  function abrirResultados(lista){
    const results = document.getElementById("results");
    const overlay = document.getElementById("overlay");
    results.innerHTML = "";

    if (!Array.isArray(lista) || lista.length === 0){
      results.innerHTML = '<div class="result">Nenhum convite pendente encontrado.</div>';
    }else{
      lista.forEach(convite => {
        const item = document.createElement("div");
        item.className = "result";
        item.innerHTML = `
          <div class="result-name">${escapeHtml(convite.nome || "Sem nome")}</div>
          <div class="result-meta">${escapeHtml(formatPhone(convite.telefone))} · Adultos: ${Number(convite.saldoAdultos||0)} · Menores: ${Number(convite.saldoMenores||0)} · ${escapeHtml(convite.statusEntrada||"")}</div>
        `;
        item.onclick = () => {
          fecharResultados();
          scanEnabled = false;
          carregarConvite(String(convite.idQr));
        };
        results.appendChild(item);
      });
    }

    overlay.style.display = "block";
  }

  function fecharResultados(){
    document.getElementById("overlay").style.display = "none";
  }

  function renderConvite(p){
    const status = String(p.statusEntrada || "AGUARDANDO").toUpperCase();
    const statusClass = status === "CONCLUIDO" ? "done" : status === "PARCIAL" ? "partial" : "wait";
    const autoridade = p.autoridade ? '<span class="badge authority">⭐ AUTORIDADE / PARCEIRO</span>' : '';

    const apoio = p.precisaApoio
      ? `<div class="alert support"><b>♿ Adaptação ou apoio necessário</b><br>${escapeHtml(p.apoioDetalhes || p.apoio || "Não especificado")}</div>`
      : "";

    const participante = p.nomeParticipante
      ? `<div class="info-row"><div class="label">Participante da peça</div><div class="value">${escapeHtml(p.nomeParticipante)}</div></div>`
      : "";

    const saldoAdultos = Number(p.saldoAdultos || 0);
    const saldoMenores = Number(p.saldoMenores || 0);
    const concluido = status === "CONCLUIDO";
    const formulario = concluido
      ? '<div class="alert success"><b>✅ Convite concluído.</b><br>Não há saldo restante para entrada.</div>'
      : `
        <div class="section-title">Entrada agora</div>
        <div class="qty-grid">
          <div class="qty-box">
            <label for="adultosEntrada">Adultos</label>
            <div class="qty-control">
              <input id="adultosEntrada" type="number" inputmode="numeric" min="0" max="${saldoAdultos}" value="${saldoAdultos}" onfocus="this.select()" />
              <div class="qty-stepper">
                <button type="button" aria-label="Aumentar adultos" onclick="ajustarQuantidade('adultosEntrada',1)" ${saldoAdultos <= 0 ? 'disabled' : ''}>▲</button>
                <button type="button" aria-label="Diminuir adultos" onclick="ajustarQuantidade('adultosEntrada',-1)" ${saldoAdultos <= 0 ? 'disabled' : ''}>▼</button>
              </div>
            </div>
            <div class="qty-help">Máximo: ${saldoAdultos}</div>
          </div>
          <div class="qty-box">
            <label for="menoresEntrada">Menores</label>
            <div class="qty-control">
              <input id="menoresEntrada" type="number" inputmode="numeric" min="0" max="${saldoMenores}" value="${saldoMenores}" onfocus="this.select()" />
              <div class="qty-stepper">
                <button type="button" aria-label="Aumentar menores" onclick="ajustarQuantidade('menoresEntrada',1)" ${saldoMenores <= 0 ? 'disabled' : ''}>▲</button>
                <button type="button" aria-label="Diminuir menores" onclick="ajustarQuantidade('menoresEntrada',-1)" ${saldoMenores <= 0 ? 'disabled' : ''}>▼</button>
              </div>
            </div>
            <div class="qty-help">Máximo: ${saldoMenores}</div>
          </div>
        </div>
        <button onclick="confirmarEntrada()">✅ Confirmar entrada</button>
      `;

    out.classList.remove("hidden");
    out.innerHTML = `
      <div>
        <span class="badge ${statusClass}">${escapeHtml(status)}</span>${autoridade}
      </div>
      <div class="name">${escapeHtml(p.nome || "---")}</div>
      <div class="meta">${escapeHtml(formatPhone(p.telefone))}</div>

      <div class="grid">
        <div class="stat">
          <div class="label">Saldo adultos</div>
          <div class="value">${saldoAdultos}</div>
          <div class="small">de ${Number(p.adultosTotal||0)} autorizados</div>
        </div>
        <div class="stat">
          <div class="label">Saldo menores</div>
          <div class="value">${saldoMenores}</div>
          <div class="small">de ${Number(p.menoresTotal||0)} autorizados</div>
        </div>
      </div>

      <div class="info-row"><div class="label">Tipo de convite</div><div class="value">${escapeHtml(p.tipoConvite || "Não informado")}</div></div>
      ${participante}
      ${apoio}
      ${formulario}
      <button class="light" onclick="novaLeitura()">↩️ Nova leitura</button>
    `;
  }

  function ajustarQuantidade(id, delta){
    const input = document.getElementById(id);
    if (!input) return;

    const min = Number(input.min || 0);
    const max = Number(input.max || 0);
    const atual = Number.parseInt(input.value, 10);
    const base = Number.isFinite(atual) ? atual : 0;
    input.value = clampInt(base + delta, min, max);
  }

  async function confirmarEntrada(){
    if (!currentInvite) return;

    const adultos = clampInt(document.getElementById("adultosEntrada")?.value, 0, Number(currentInvite.saldoAdultos||0));
    const menores = clampInt(document.getElementById("menoresEntrada")?.value, 0, Number(currentInvite.saldoMenores||0));

    if (adultos <= 0 && menores <= 0){
      toast("Informe quantas pessoas estão entrando agora.", "warn");
      return;
    }

    mostrarLoading("Registrando entrada...");

    try{
      const resultado = await api("registrarEntrada", {
        id_qr:String(currentInvite.idQr),
        adultos_entrada:adultos,
        menores_entrada:menores,
        operador:OPERADOR
      });

      currentInvite = resultado.convite;
      renderConvite(currentInvite);
      toast("Entrada registrada com sucesso.", "ok");
    }catch(error){
      mostrarErro(error.message || String(error));
    }
  }

  function novaLeitura(){
    currentInvite = null;
    out.innerHTML = "";
    out.classList.add("hidden");
    if (cameraStarted){
      scanEnabled = true;
      toast("Pronto para nova leitura.", "ok");
    }
  }

  function mostrarLoading(texto){
    out.classList.remove("hidden");
    out.innerHTML = `<span class="badge wait">⏳ ${escapeHtml(texto)}</span>`;
  }

  function mostrarErro(texto){
    out.classList.remove("hidden");
    out.innerHTML = `<div class="alert error"><b>❌ Não foi possível continuar</b><br>${escapeHtml(texto)}</div><button class="light" onclick="novaLeitura()">Tentar outra leitura</button>`;
  }

  function clampInt(valor, min, max){
    let n = Number.parseInt(valor,10);
    if (!Number.isFinite(n)) n = 0;
    return Math.max(min,Math.min(max,n));
  }

  function formatPhone(v){
    const d = String(v||"").replace(/\D/g,"");
    if (d.length === 11) return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
    if (d.length === 10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;
    return d;
  }

  function escapeHtml(value){
    return String(value ?? "").replace(/[&<>"']/g, ch => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[ch]));
  }

  document.getElementById("searchInput").addEventListener("keydown", e => {
    if (e.key === "Enter") buscarManual();
  });
</script>
</body>
</html>
